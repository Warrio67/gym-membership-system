<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Membership System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-3">
      <i class="fas fa-dumbbell fa-2x text-accent"></i>
      <h3 class="mt-2 mb-0">Gym Membership</h3>
      <div class="text-muted small">Navy Blue Fitness Suite</div>
    </div>

    <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="signin">Sign In</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="signup">Sign Up</button></li>
    </ul>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <!-- Sign In -->
    <form id="signinForm" class="auth-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" required>
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="button" class="btn btn-link btn-sm p-0 mb-3" id="forgotLink">Forgot password?</button>
      <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      <div class="text-center text-muted small mt-3">Default login: <b>admin / admin123</b></div>
    </form>

    <!-- Sign Up -->
    <form id="signupForm" class="auth-form d-none">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-plus"></i> Create Account</button>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="app-shell d-none">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fas fa-dumbbell"></i> <span class="brand-text">Gym Suite</span></div>
    <ul class="side-menu" id="sideMenu"></ul>
  </div>
  <div class="main-col">
    <div class="navbar-top">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-icon" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <div>
          <div class="crumb" id="crumbText">Home / Dashboard</div>
          <div class="page-title" id="pageTitle"><i class="fas fa-gauge-high"></i> Dashboard</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small" id="welcomeText"></span>
        <button class="btn-icon" id="darkToggle"><i class="fas fa-moon"></i></button>
        <div class="avatar-circle" id="avatarCircle"></div>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal fade" id="genericModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="genericModalTitle">Title</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="genericModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="genericModalConfirm">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
